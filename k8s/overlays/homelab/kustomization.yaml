apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mcp-everything

resources:
  - ../../base
  # Generated by Sealed Secrets; contains ANTHROPIC_API_KEY, JWT_SECRET,
  # JWT_REFRESH_SECRET, DATABASE_PASSWORD. Decrypted in-cluster by the
  # sealed-secrets controller into a plain Secret named
  # mcp-everything-secrets, which base/backend/deployment.yaml and
  # base/postgres/statefulset.yaml both reference directly.
  - sealed-secret.yaml

images:
  - name: mcp-everything/backend
    newName: harbor.192.168.1.240.nip.io/mcp-everything/backend
    newTag: e3600879c2f62895a9f4307526141f495b2fbae9
  - name: mcp-everything/frontend
    newName: harbor.192.168.1.240.nip.io/mcp-everything/frontend
    newTag: e3600879c2f62895a9f4307526141f495b2fbae9

# Non-secret backend env. Kustomize hashes this ConfigMap's name and rewrites
# the envFrom.configMapRef in base/backend/deployment.yaml to match, so a
# config change rolls the Deployment automatically.
configMapGenerator:
  - name: backend-config
    literals:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_HOST=mcp-postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=mcp
      - DATABASE_NAME=mcp_everything
      # Public domain via the Cloudflare Tunnel (see homelab repo
      # cloudflare-tunnel.md); TLS terminates at Cloudflare, Traefik serves
      # HTTP. Used for password-reset email links and Stripe redirects, so it
      # must be the public https origin, not the LAN nip.io host.
      - FRONTEND_URL=https://mcpeverything.com
      - MCP_TESTING_ALLOW_UNSANDBOXED=true
      - GENERATED_SERVERS_DIR=/data/generated-servers
      - PIPELINE_INTENT_CONFIDENCE_MIN=0.75
      # GitHubStrategy/GoogleStrategy (src/auth/strategies/*.ts) are
      # unconditionally instantiated by AuthModule and call
      # Real OAuth apps for the public domain. Client IDs are public by
      # design; the matching GITHUB_CLIENT_SECRET / GOOGLE_CLIENT_SECRET live
      # in sealed-secret.yaml (Secret mcp-everything-secrets), not here.
      # GitHub: production OAuth app "MCP Everything" (a separate dev app
      # covers localhost). Google: one shared web client whose authorized
      # redirect URIs include both localhost and mcpeverything.com.
      - GITHUB_CLIENT_ID=Ov23li387fiJNgIKyKA9
      - GITHUB_CALLBACK_URL=https://mcpeverything.com/api/v1/auth/github/callback
      - GOOGLE_CLIENT_ID=673009220775-mebimjt3cta9iscemnt274h2absh504m.apps.googleusercontent.com
      - GOOGLE_CALLBACK_URL=https://mcpeverything.com/api/v1/auth/google/callback

patches:
  - path: patches/backend.yaml
    target:
      kind: Deployment
      name: mcp-backend
  - path: patches/frontend.yaml
    target:
      kind: Deployment
      name: mcp-frontend
  - path: patches/postgres.yaml
    target:
      kind: StatefulSet
      name: mcp-postgres
  - path: patches/ingress.yaml
    target:
      kind: Ingress
      name: mcp-everything
