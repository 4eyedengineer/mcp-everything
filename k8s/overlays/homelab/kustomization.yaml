apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mcp-everything

resources:
  - ../../base
  # Generated by Sealed Secrets; contains ANTHROPIC_API_KEY, JWT_SECRET,
  # JWT_REFRESH_SECRET, DATABASE_PASSWORD. Decrypted in-cluster by the
  # sealed-secrets controller into a plain Secret named
  # mcp-everything-secrets, which base/backend/deployment.yaml and
  # base/postgres/statefulset.yaml both reference directly via envFrom.secretRef
  # (so any key added to the decrypted Secret is automatically exposed as an
  # env var to the backend container - no deployment.yaml change needed).
  #
  # TODO(GitHub OAuth token encryption): this Secret is MISSING
  # `TOKEN_ENCRYPTION_KEY` (see src/common/token-encryption/token-encryption.service.ts
  # and packages/backend/.env.example). Without it the backend does NOT crash
  # (fails gracefully: GitHub login still works, but the user's access token
  # is not persisted, so per-user GitHub repo listing is unavailable here).
  # To finish: generate a value with
  #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
  # then seal it with `kubeseal` (same flow as the other four keys below) and
  # add the resulting `TOKEN_ENCRYPTION_KEY` entry to sealed-secret.yaml's
  # `encryptedData` - it cannot be sealed from this workstation, a human with
  # `kubeseal` access to the cluster's public cert must do it.
  - sealed-secret.yaml

images:
  - name: mcp-everything/backend
    newName: harbor.192.168.1.240.nip.io/mcp-everything/backend
    newTag: e3600879c2f62895a9f4307526141f495b2fbae9
  - name: mcp-everything/frontend
    newName: harbor.192.168.1.240.nip.io/mcp-everything/frontend
    newTag: e3600879c2f62895a9f4307526141f495b2fbae9

# Non-secret backend env. Kustomize hashes this ConfigMap's name and rewrites
# the envFrom.configMapRef in base/backend/deployment.yaml to match, so a
# config change rolls the Deployment automatically.
configMapGenerator:
  - name: backend-config
    literals:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_HOST=mcp-postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=mcp
      - DATABASE_NAME=mcp_everything
      # Public domain via the Cloudflare Tunnel (see homelab repo
      # cloudflare-tunnel.md); TLS terminates at Cloudflare, Traefik serves
      # HTTP. Used for password-reset email links and Stripe redirects, so it
      # must be the public https origin, not the LAN nip.io host.
      - FRONTEND_URL=https://mcpeverything.com
      # Public origin of the hosted-server MCP gateway. HostingService writes
      # each hosted server's endpointUrl as
      #   <MCP_GATEWAY_PUBLIC_URL>/api/hosting/servers/<serverId>/mcp
      # and defaults to http://localhost:3000 when unset - which is what
      # production was handing users before this was added (verified
      # 2026-08-03: routing worked, the advertised URL did not).
      - MCP_GATEWAY_PUBLIC_URL=https://mcpeverything.com
      # Origin a hosted server's POD dials to fetch its own generated source.
      # Deliberately NOT the public origin above: that one is proxied through
      # Cloudflare, so using it would send every hosted-server cold start out
      # to the internet and back for bytes that never had to leave the
      # cluster. This is the in-cluster Service, and it is exactly the one
      # destination k8s/mcp-servers/network-policy.yaml carves out of the
      # otherwise total RFC1918 egress block for hosted pods.
      - MCP_SOURCE_BASE_URL=http://mcp-backend.mcp-everything.svc.cluster.local:3000
      # The ONE image every hosted MCP server runs, as both its initContainer
      # (fetch source, npm install, tsc) and its main container. There are no
      # per-server image builds - the backend pod has no docker daemon. Must
      # be multi-arch: this cluster is 4x arm64 + 3x amd64 and generated
      # Deployments carry no nodeSelector. See packages/mcp-runner/README.md.
      - MCP_RUNNER_IMAGE=harbor.192.168.1.240.nip.io/mcp-everything/mcp-runner:latest
      - MCP_TESTING_ALLOW_UNSANDBOXED=true
      - GENERATED_SERVERS_DIR=/data/generated-servers
      - PIPELINE_INTENT_CONFIDENCE_MIN=0.75
      # GitHubStrategy/GoogleStrategy (src/auth/strategies/*.ts) are
      # unconditionally instantiated by AuthModule and call
      # Real OAuth apps for the public domain. Client IDs are public by
      # design; the matching GITHUB_CLIENT_SECRET / GOOGLE_CLIENT_SECRET live
      # in sealed-secret.yaml (Secret mcp-everything-secrets), not here.
      # GitHub: production OAuth app "MCP Everything" (a separate dev app
      # covers localhost). Google: one shared web client whose authorized
      # redirect URIs include both localhost and mcpeverything.com.
      - GITHUB_CLIENT_ID=Ov23li387fiJNgIKyKA9
      - GITHUB_CALLBACK_URL=https://mcpeverything.com/api/v1/auth/github/callback
      - GOOGLE_CLIENT_ID=673009220775-mebimjt3cta9iscemnt274h2absh504m.apps.googleusercontent.com
      - GOOGLE_CALLBACK_URL=https://mcpeverything.com/api/v1/auth/google/callback

patches:
  - path: patches/backend.yaml
    target:
      kind: Deployment
      name: mcp-backend
  - path: patches/frontend.yaml
    target:
      kind: Deployment
      name: mcp-frontend
  - path: patches/postgres.yaml
    target:
      kind: StatefulSet
      name: mcp-postgres
  - path: patches/ingress.yaml
    target:
      kind: Ingress
      name: mcp-everything
