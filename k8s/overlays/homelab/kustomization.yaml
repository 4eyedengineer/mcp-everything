apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mcp-everything

resources:
  - ../../base
  # Generated by Sealed Secrets; contains ANTHROPIC_API_KEY, JWT_SECRET,
  # JWT_REFRESH_SECRET, DATABASE_PASSWORD. Decrypted in-cluster by the
  # sealed-secrets controller into a plain Secret named
  # mcp-everything-secrets, which base/backend/deployment.yaml and
  # base/postgres/statefulset.yaml both reference directly.
  - sealed-secret.yaml

images:
  - name: mcp-everything/backend
    newName: harbor.192.168.1.240.nip.io/mcp-everything/backend
    newTag: latest
  - name: mcp-everything/frontend
    newName: harbor.192.168.1.240.nip.io/mcp-everything/frontend
    newTag: latest

# Non-secret backend env. Kustomize hashes this ConfigMap's name and rewrites
# the envFrom.configMapRef in base/backend/deployment.yaml to match, so a
# config change rolls the Deployment automatically.
configMapGenerator:
  - name: backend-config
    literals:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_HOST=mcp-postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=mcp
      - DATABASE_NAME=mcp_everything
      - FRONTEND_URL=http://mcp.192.168.1.240.nip.io
      - MCP_TESTING_ALLOW_UNSANDBOXED=true
      - GENERATED_SERVERS_DIR=/data/generated-servers
      - PIPELINE_INTENT_CONFIDENCE_MIN=0.75
      # GitHubStrategy/GoogleStrategy (src/auth/strategies/*.ts) are
      # unconditionally instantiated by AuthModule and call
      # passport-oauth2's Strategy constructor, which throws synchronously
      # ("OAuth2Strategy requires a clientID option") if these are unset -
      # that crashes the whole Nest app at boot, not just OAuth login.
      # Verified locally: the image exits immediately without these. Real
      # GitHub/Google OAuth apps are not set up for this homelab deployment,
      # so these are inert placeholders that satisfy the constructor only -
      # the /auth/github and /auth/google routes will not work until real
      # OAuth app credentials replace them.
      - GITHUB_CLIENT_ID=unset-homelab-placeholder
      - GITHUB_CLIENT_SECRET=unset-homelab-placeholder
      - GITHUB_CALLBACK_URL=http://mcp.192.168.1.240.nip.io/api/v1/auth/github/callback
      - GOOGLE_CLIENT_ID=unset-homelab-placeholder
      - GOOGLE_CLIENT_SECRET=unset-homelab-placeholder
      - GOOGLE_CALLBACK_URL=http://mcp.192.168.1.240.nip.io/api/v1/auth/google/callback

patches:
  - path: patches/backend.yaml
    target:
      kind: Deployment
      name: mcp-backend
  - path: patches/frontend.yaml
    target:
      kind: Deployment
      name: mcp-frontend
  - path: patches/postgres.yaml
    target:
      kind: StatefulSet
      name: mcp-postgres
  - path: patches/ingress.yaml
    target:
      kind: Ingress
      name: mcp-everything
