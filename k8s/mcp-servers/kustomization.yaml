# Cluster prerequisites for the direct Kubernetes control plane.
#
# Apply BEFORE the backend can host anything:
#
#   kubectl apply -k k8s/mcp-servers
#
# Intentionally NOT referenced from k8s/base/kustomization.yaml: that base sets
# `namespace: mcp-everything`, which would rewrite every object here into the
# backend's own namespace and silently produce a Role bound to the wrong place.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - rbac.yaml
  - limits.yaml
  - network-policy.yaml
