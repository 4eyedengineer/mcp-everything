apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-backend
  labels:
    app: mcp-backend
    app.kubernetes.io/name: mcp-backend
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-backend
  template:
    metadata:
      labels:
        app: mcp-backend
        app.kubernetes.io/name: mcp-backend
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        fsGroup: 1001
      # Runs migrations to completion before the API starts accepting traffic.
      # Production disables TypeORM `synchronize` (see app.module.ts), so the
      # schema - including `CREATE EXTENSION vector` - only exists once this
      # has run against the postgres service below.
      initContainers:
        - name: migrate
          image: mcp-everything/backend:latest
          imagePullPolicy: IfNotPresent
          command: ['npm', 'run', 'migration:run']
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: mcp-everything-secrets
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
      containers:
        - name: backend
          image: mcp-everything/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: mcp-everything-secrets
          volumeMounts:
            - name: generated-servers
              mountPath: /data/generated-servers
          # Resource requests/limits are cluster-specific - see
          # overlays/homelab/patches/backend-resources.yaml.
          # /health/ready is degraded (200) rather than unhealthy (503) when
          # Redis/GitHub/Tavily are down or unconfigured - see health.service.ts
          # calculateOverallStatus(). It only 503s when the database is
          # unreachable or ANTHROPIC_API_KEY is missing, both of which really
          # do mean "not ready for traffic". No Redis runs in this cluster, so
          # this probe passes without it by design, not by accident.
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
      volumes:
        # Generated MCP server source lives here transiently. Losing it on pod
        # restart is acceptable - persist() writes the final artifact to
        # postgres, and the pipeline can regenerate.
        - name: generated-servers
          emptyDir: {}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
