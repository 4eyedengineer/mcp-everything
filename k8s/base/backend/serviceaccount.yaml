# Identity the backend pod runs as, so the RoleBinding in
# k8s/mcp-servers/rbac.yaml has a concrete subject to grant.
#
# Before this existed the backend ran as the `default` ServiceAccount of the
# mcp-everything namespace, which had no permissions in `mcp-servers` at all -
# every call the new K8sControlPlaneService makes would have been rejected 403.
#
# automountServiceAccountToken is left at its default (true) here on purpose:
# unlike the hosted-server pods, this backend genuinely does need to
# authenticate to the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-backend
  labels:
    app.kubernetes.io/name: mcp-backend
    app.kubernetes.io/component: backend
