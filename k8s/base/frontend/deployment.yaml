apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-frontend
  labels:
    app: mcp-frontend
    app.kubernetes.io/name: mcp-frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-frontend
  template:
    metadata:
      labels:
        app: mcp-frontend
        app.kubernetes.io/name: mcp-frontend
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: mcp-everything/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # nginx.conf serves the SPA and needs no backend env - the ingress
          # routes /api straight to the backend Service, so there is nothing
          # for the frontend container to be configured with.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
      restartPolicy: Always
      terminationGracePeriodSeconds: 15
