<nav class="top-nav">
  <div class="nav-content">
    <!-- Left Section: Brand + Hamburger -->
    <div class="nav-left">
      <a
        routerLink="/chat"
        class="brand-link"
        aria-label="MCP Everything - go to chat">
        <mat-icon class="brand-icon">hub</mat-icon>
        <span class="brand-text">MCP Everything</span>
      </a>

      <button
        mat-icon-button
        (click)="onToggleSidebar()"
        class="hamburger-button"
        aria-label="Toggle sidebar"
        matTooltip="Toggle sidebar">
        <mat-icon>menu</mat-icon>
      </button>
    </div>

    <!-- Center Section: Navigation Links -->
    <div class="nav-center">
      <button
        mat-button
        routerLink="/chat"
        routerLinkActive="active"
        class="nav-button"
        aria-label="Chat">
        <mat-icon>chat_bubble_outline</mat-icon>
        <span class="nav-label">Chat</span>
      </button>
      <button
        mat-button
        routerLink="/explore"
        routerLinkActive="active"
        class="nav-button"
        aria-label="Explore">
        <mat-icon>explore</mat-icon>
        <span class="nav-label">Explore</span>
      </button>
      <button
        mat-button
        routerLink="/servers"
        routerLinkActive="active"
        class="nav-button"
        aria-label="My Servers">
        <mat-icon>dns</mat-icon>
        <span class="nav-label">My Servers</span>
      </button>
    </div>

    <!-- Right Section: Action Icons -->
    <div class="nav-right">
      <button
        mat-icon-button
        matTooltip="Documentation"
        aria-label="Documentation"
        class="nav-icon-button">
        <mat-icon>menu_book</mat-icon>
      </button>

      <button
        mat-icon-button
        [matMenuTriggerFor]="accountMenu"
        matTooltip="Account"
        aria-label="Account menu"
        class="nav-icon-button">
        <mat-icon>account_circle</mat-icon>
      </button>

      <mat-menu #accountMenu="matMenu">
        <button mat-menu-item routerLink="/account" aria-label="Account settings">
          <mat-icon>settings</mat-icon>
          <span>Account settings</span>
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="logout()" aria-label="Log out">
          <mat-icon>logout</mat-icon>
          <span>Log out</span>
        </button>
      </mat-menu>
    </div>
  </div>
</nav>
